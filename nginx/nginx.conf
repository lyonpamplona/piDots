# ==============================================================================
# piDots Edge Proxy - Nginx Alpine Multi-Porta (< 8MB RAM)
# Calibrado para Raspberry Pi 4B (ARM64 Cortex-A72)
# Arquitetura de Desacoplamento por Portas (Cloudflare Tunnel & LAN)
# ==============================================================================
# Portas de Escuta:
# - 8081: Serviço da Landing Page (Vitrine / Onboarding)
# - 8082: Serviço do Console Workspace (App SPA / PWA)
# - 8083: Serviço de Documentação & Relatórios (Docs & Knowledge)
# - 8088: Gateway Unificado Retrocompatível (Path-Based)
# ==============================================================================

worker_processes 1;
pid /var/run/nginx.pid;

events {
    worker_connections 512;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Otimização de I/O em Kernel Linux ARM64 (Zero-Copy sendfile)
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    server_tokens   off;

    # Cabeçalhos Globais Defensivos de Segurança (RFC 6797, 7034, 6954)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compressão Gzip leve para CSS, JS, JSON e SVG
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 512;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Preservação do Protocolo de Borda (HTTPS Cloudflare vs HTTP Local)
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # Suporte a WebSockets e Conexões Persistentes Keepalive (Upstream Pool 16)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      "";
    }

    # Upstream assíncrono para o backend FastAPI (pidots-core:8000)
    upstream pidots_backend {
        server pidots-core:8000;
        keepalive 16;
    }

    # ==========================================================================
    # SERVIDOR 1: PORTA 8081 — SERVIÇO DE LANDING PAGE & ONBOARDING
    # ==========================================================================
    server {
        listen 8081;
        server_name _;

        # Assets estáticos servidos diretamente do disco
        location /static/ {
            alias /usr/share/nginx/html/static/;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Edge-Service "landing-static";
        }

        # Dicionários de internacionalização (PT/EN)
        location /data/locales/ {
            alias /usr/share/nginx/html/data/locales/;
            access_log off;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Edge-Service "landing-locales";
        }

        # Manifesto PWA, Service Worker, Ícones e Favicon
        location = /manifest.json {
            proxy_pass http://pidots_backend/manifest.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /sw.js {
            proxy_pass http://pidots_backend/sw.js;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /favicon.ico {
            proxy_pass http://pidots_backend/icon.svg;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ~* ^/icon.* {
            proxy_pass http://pidots_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Raiz da porta 8081 entrega a Landing Page oficial
        location = / {
            proxy_pass http://pidots_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection "";
            add_header X-Edge-Service "landing-surface";
        }

        # Proxy de APIs, Streaming SSE AG-UI e WebSockets
        location /api/ {
            proxy_pass http://pidots_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Configurações essenciais para SSE AG-UI e WebSockets sem latência
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /health {
            proxy_pass http://pidots_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Fallback Geral Catch-All (Garante zero 404 em trailing slash e subrotas)
        location / {
            proxy_pass http://pidots_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }

    # ==========================================================================
    # SERVIDOR 2: PORTA 8082 — SERVIÇO DO CONSOLE WORKSPACE (APP SPA / PWA)
    # ==========================================================================
    server {
        listen 8082;
        server_name _;

        # Assets estáticos servidos diretamente do disco
        location /static/ {
            alias /usr/share/nginx/html/static/;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Edge-Service "app-static";
        }

        # Dicionários de internacionalização (PT/EN)
        location /data/locales/ {
            alias /usr/share/nginx/html/data/locales/;
            access_log off;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Edge-Service "app-locales";
        }

        # Manifesto PWA, Service Worker, Ícones e Favicon
        location = /manifest.json {
            proxy_pass http://pidots_backend/manifest.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /sw.js {
            proxy_pass http://pidots_backend/sw.js;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /favicon.ico {
            proxy_pass http://pidots_backend/icon.svg;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ~* ^/icon.* {
            proxy_pass http://pidots_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Raiz da porta 8082 entrega DIRETAMENTE o Console Workspace (/app)
        location = / {
            proxy_pass http://pidots_backend/app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection "";
            add_header X-Edge-Service "app-console-root";
        }

        # Proxy Reverso para API e Streaming SSE AG-UI (/api/threads/{id}/runs)
        location /api/ {
            proxy_pass http://pidots_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Configurações essenciais para SSE AG-UI e WebSockets sem latência
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /health {
            proxy_pass http://pidots_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Fallback Geral Catch-All (Garante zero 404 em /app, /app/, /docs, etc.)
        location / {
            proxy_pass http://pidots_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }

    # ==========================================================================
    # SERVIDOR 3: PORTA 8083 — SERVIÇO DE DOCUMENTAÇÃO & ESTUDOS (DOCS)
    # ==========================================================================
    server {
        listen 8083;
        server_name _;

        # Assets estáticos servidos diretamente do disco
        location /static/ {
            alias /usr/share/nginx/html/static/;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Edge-Service "docs-static";
        }

        # Dicionários de internacionalização (PT/EN)
        location /data/locales/ {
            alias /usr/share/nginx/html/data/locales/;
            access_log off;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Edge-Service "docs-locales";
        }

        # Manifesto PWA, Service Worker, Ícones e Favicon
        location = /manifest.json {
            proxy_pass http://pidots_backend/manifest.json;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /sw.js {
            proxy_pass http://pidots_backend/sw.js;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location = /favicon.ico {
            proxy_pass http://pidots_backend/icon.svg;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location ~* ^/icon.* {
            proxy_pass http://pidots_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Raiz da porta 8083 entrega DIRETAMENTE o Guia Operacional (/docs)
        location = / {
            proxy_pass http://pidots_backend/docs;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection "";
            add_header X-Edge-Service "docs-guide-root";
        }

        # Proxy de APIs, Streaming SSE AG-UI e WebSockets
        location /api/ {
            proxy_pass http://pidots_backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Configurações essenciais para SSE AG-UI e WebSockets sem latência
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location = /health {
            proxy_pass http://pidots_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Fallback Geral Catch-All (Garante zero 404 em /docs/, /relatorio/, etc.)
        location / {
            proxy_pass http://pidots_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }

    # ==========================================================================
    # SERVIDOR 4: PORTA 8088 / 80 — GATEWAY UNIFICADO RETROCOMPATÍVEL (PATH-BASED)
    # ==========================================================================
    server {
        listen 8088 default_server;
        listen 80;
        server_name _;

        # Assets estáticos servidos diretamente do disco
        location /static/ {
            alias /usr/share/nginx/html/static/;
            access_log off;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Edge-Static "nginx-direct";
        }

        # Dicionários de internacionalização (PT/EN)
        location /data/locales/ {
            alias /usr/share/nginx/html/data/locales/;
            access_log off;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Edge-Static "nginx-locales";
        }

        # Redirecionamentos Canônicos Permanentes (HTTP 308 + RFC 8594 Sunset)
        location = /apresentacao {
            add_header Sunset "Wed, 01 Jan 2027 00:00:00 GMT" always;
            add_header Link '</>; rel="canonical"' always;
            return 308 /;
        }

        location = /guia {
            add_header Sunset "Wed, 01 Jan 2027 00:00:00 GMT" always;
            add_header Link '</docs>; rel="canonical"' always;
            return 308 /docs;
        }

        location = /console {
            add_header Sunset "Wed, 01 Jan 2027 00:00:00 GMT" always;
            add_header Link '</app>; rel="canonical"' always;
            return 308 /app;
        }

        # Proxy Reverso Assíncrono Geral (todas as rotas path-based)
        location / {
            proxy_pass http://pidots_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;

            # Crítico para Streaming SSE AG-UI (/api/threads/{id}/runs)
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
