name: Integracao Continua e Validacao Multi-Arch de Borda (CI)

"on":
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Testes Automatizados (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configuracao do Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Instalacao de Dependencias do Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Instalacao do piDots em Modo Editavel
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e .

      - name: Auditoria de Regra de Estilo (Zero Emojis)
        run: |
          python3 -c "
          import os, re, sys
          emoji_pattern = re.compile(r'[\U00010000-\U0010ffff]', flags=re.UNICODE)
          errors = 0
          for root, dirs, files in os.walk('.'):
              if any(ignored in root for ignored in ['.git', '.venv', '__pycache__', 'workspaces', 'data']):
                  continue
              for f in files:
                  if f.endswith(('.py', '.md', '.toml', '.yml', '.yaml', '.html', '.txt')):
                      path = os.path.join(root, f)
                      with open(path, 'r', encoding='utf-8', errors='ignore') as fp:
                          text = fp.read()
                      matches = emoji_pattern.findall(text)
                      if matches:
                          print(f'ERRO: Emoji detectado em {path}: {matches}')
                          errors += 1
          if errors > 0:
              sys.exit(1)
          print('Conformidade de estilo validada: zero emojis detectados no repositorio.')
          "

      - name: Inicializacao de Estruturas Locais
        run: |
          pidots init

      - name: Execucao das Suites de Testes de Regressao e Governanca
        run: |
          python scripts/test_phase1.py
          python scripts/test_phase2.py
          python scripts/test_phase3.py
          python scripts/test_phase4.py
          python scripts/test_phase5.py
          python scripts/test_phase14_strict_sandbox_and_routers.py
          python scripts/test_phase1_opendots_agui.py
          python scripts/test_phase2_opendots_layout.py
          python scripts/test_phase3_opendots_dynamic_js.py
          python scripts/test_phase4_opendots_homologation.py
          python scripts/test_phase16_19_roadmap_evolution.py

      - name: Execucao do Teste de Concorrencia e Estresse de Borda
        run: |
          python scripts/stress_test.py

      - name: Validacao da Interface CLI do piDots
        run: |
          pidots --version
          pidots status

  docker-multiarch-build:
    name: Build Multi-Arquitetura Docker (linux/arm64 & linux/amd64)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout do Repositorio
        uses: actions/checkout@v4

      - name: Configuracao do QEMU para Emulacao ARM64 (Raspberry Pi 4B)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,amd64

      - name: Configuracao do Docker Buildx Multi-Arch
        uses: docker/setup-buildx-action@v3

      - name: Build e Validacao Multi-Arch (linux/amd64,linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ghcr.io/lyonchristopher/pidots:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
