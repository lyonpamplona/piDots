# ==============================================================================
# piDots Core - Docker Compose para Raspberry Pi 4B (ARM64)
# Calibrado para baixo consumo de memória, rotação de logs e proteção do MicroSD
# ==============================================================================

x-logging-edge: &edge-logging
  driver: "json-file"
  options:
    max-size: "5m"
    max-file: "2"

services:
  pidots-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pidots-core
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - AI_BASE_URL=${AI_BASE_URL:-https://api.openai.com/v1}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - AI_MAX_RETRIES=${AI_MAX_RETRIES:-3}
      - AI_TIMEOUT_SECONDS=${AI_TIMEOUT_SECONDS:-60.0}
      - AI_FALLBACK_URL=${AI_FALLBACK_URL:-}
      - AI_FALLBACK_API_KEY=${AI_FALLBACK_API_KEY:-}
      - AI_FALLBACK_MODEL=${AI_FALLBACK_MODEL:-}
      - HOST=0.0.0.0
      - PORT=8000
      - SQLITE_DB_PATH=/app/data/pidots.db
      - WORKSPACES_ROOT=/app/workspaces
      - STRICT_SANDBOX=${STRICT_SANDBOX:-false}
      - ENABLE_LEGACY_REDIRECTS=${ENABLE_LEGACY_REDIRECTS:-true}
      - MAX_ITERATIONS_PER_GOAL=${MAX_ITERATIONS_PER_GOAL:-8}
      - ENABLE_THERMAL_THROTTLE=${ENABLE_THERMAL_THROTTLE:-true}
      - THERMAL_LIMIT_CELSIUS=${THERMAL_LIMIT_CELSIUS:-78.0}
    volumes:
      # Armazenamento de dados persistentes do SQLite WAL
      - ./data:/app/data
      # Espaço de trabalho dos Dots
      - ./workspaces:/app/workspaces
      # Sincronização de código e frontend modular
      - ./pidots:/app/pidots
      - ./pages:/app/pages
      - ./static:/app/static
      # Proteção do MicroSD: /tmp em memória volátil (tmpfs)
    tmpfs:
      - /tmp:rw,nosuid,size=64m
    logging: *edge-logging
    deploy:
      resources:
        limits:
          cpus: '1.2'
          memory: 384M
        reservations:
          cpus: '0.2'
          memory: 64M

  pidots-nginx:
    image: nginx:1.27-alpine
    container_name: pidots-nginx
    restart: unless-stopped
    depends_on:
      - pidots-core
    ports:
      # Portas Desacopladas de Borda (Prontas para Cloudflare Tunnel & LAN)
      - "${PORT_GATEWAY:-${NGINX_PORT:-8088}}:8088"
      - "${PORT_LANDING:-8081}:8081"
      - "${PORT_APP:-8082}:8082"
      - "${PORT_DOCS:-8083}:8083"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html/static:ro
      - ./data/locales:/usr/share/nginx/html/data/locales:ro
    logging: *edge-logging
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 32M
        reservations:
          cpus: '0.05'
          memory: 8M
